<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Bricolage Grotesque"; src: url("../../web/fonts/bricolage-grotesque-latin-wght-normal.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Atkinson Hyperlegible Next"; src: url("../../web/fonts/atkinson-hyperlegible-next-latin-wght-normal.woff2") format("woff2"); font-weight: 200 800; }
  :root { --paper:#F3F6F4; --paper-deep:#E4EBE6; --ink:#12332E; --ink-soft:#456560; --leaf:#2F8F3F; --lagoon:#1F8A8A; --sun:#F2C230; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 627px; }
  body { background: var(--paper); color: var(--ink); font-family: "Atkinson Hyperlegible Next", sans-serif;
         display: grid; grid-template-columns: 1fr 300px; padding: 64px 80px 56px; position: relative; overflow: hidden; }
  body::after { content: ""; position: absolute; right: -120px; top: -120px; width: 520px; height: 520px; border-radius: 50%; background: var(--paper-deep); z-index: 0; }
  main, aside { position: relative; z-index: 1; }
  .brand { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 92px; letter-spacing: -2px; line-height: 1; }
  .brand i { color: var(--lagoon); font-style: normal; }
  .claim { font-family: "Bricolage Grotesque", sans-serif; font-weight: 600; font-size: 46px; color: var(--lagoon); margin-top: 18px; }
  .lead { font-size: 34px; line-height: 1.3; margin-top: 34px; max-width: 640px; font-weight: 700; }
  .tags { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; max-width: 680px; }
  .tags span { font-size: 22px; padding: 8px 18px; border-radius: 999px; background: #fff; border: 2px solid var(--ink); }
  .foot { position: absolute; left: 80px; bottom: 48px; font-size: 24px; color: var(--ink-soft); z-index: 1; }
  .foot b { color: var(--ink); }
  .free { display: inline-block; background: var(--sun); color: var(--ink); font-weight: 800; padding: 4px 14px; border-radius: 8px; margin-right: 14px; }
  aside { display: flex; align-items: center; justify-content: center; }
  .light { width: 170px; height: 430px; border-radius: 85px; background: var(--ink); padding: 26px 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between; box-shadow: 0 18px 40px rgba(18,51,46,.25); }
  .light div { width: 112px; height: 112px; border-radius: 50%; background: #2c4a45; }
  .light .r { background: #D64541; box-shadow: 0 0 30px rgba(214,69,65,.7); }
  .light .g { background: var(--leaf); box-shadow: 0 0 30px rgba(47,143,63,.6); }
</style>
</head>
<body>
  <main>
    <div class="brand">EDEL<i>.</i>TRAUD<i>.</i>AI</div>
    <div class="claim">Trau, schau, wem.</div>
    <p class="lead">Schnellcheck für KI-gebaute Apps: Ampel in unter 15 Sekunden.</p>
    <div class="tags"><span>Schlüssel im Frontend</span><span>Sicherheits-Header</span><span>Supabase &amp; Firebase</span></div>
  </main>
  <aside><div class="light"><div class="r"></div><div></div><div class="g"></div></div></aside>
  <p class="foot"><span class="free">kostenlos</span><b>scan.m-ko.de</b> · ein Werkzeug von m-ko.de</p>
</body>
</html>
