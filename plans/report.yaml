# Paid report: all passive modules. Wave 2 adds collect.render (browser), crawl, DNS, privacy, a11y.
plan: report
version: 1
limits: { totalMs: 120000, requests: 400, browser: false }
modules:
  - collect.page
  - collect.bundles: { maxBundles: 80, followLazyChunks: true }
  - collect.sourcemaps: { headOnly: true, maxMaps: 20 }
  - stack.detect
  - secrets.frontend
  - headers.security
  - cookies.flags
  - tls.basics
  - sourcemaps.exposed
  - supabase.config
  - firebase.config
  - ai.client-llm-call
presentation:
  showFindings: all
  fixPrompts: true
