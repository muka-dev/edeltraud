# EDEL.TRAUD.AI on the Hetzner server: API + Ampel page for scan.m-ko.de.
# The TLS proxy already running on the server (Caddy, nginx …) forwards to 127.0.0.1:8787.
#
#   cd /opt/edeltraud/ai-check && docker compose -f deploy/compose.yaml up -d --build
# Fixed project name: containers are called edeltraud-api-1 etc., independent of the folder name.
name: edeltraud

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: edeltraud-api
    restart: unless-stopped
    env_file: /opt/edeltraud/api.env      # secrets live outside the repository, see deploy/README.md
    ports:
      - "127.0.0.1:8787:8787"             # only the local proxy can reach it
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 256
    volumes:
      - /opt/edeltraud/data:/data          # watch subscriptions (unsubscribe links)
    networks:
      default: {}
      proxy:                               # Caddy's Docker network; declared here so every recreate keeps it
        aliases: [edeltraud-api]           # Caddyfile: reverse_proxy edeltraud-api:8787

  # Weekly watch: runs once and exits. Started by a systemd timer or cron, see deploy/README.md.
  watch:
    profiles: [watch]
    build:
      context: ..
      dockerfile: Dockerfile.worker
    image: edeltraud-worker
    command: ["watch", "run"]
    env_file: /opt/edeltraud/api.env
    volumes:
      - /opt/edeltraud/data:/data
    networks: [egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g

  # Paid jobs (report, deep check): runs all the time, takes jobs from /data/jobs.
  jobs:
    profiles: [jobs]
    build:
      context: ..
      dockerfile: Dockerfile.worker
    image: edeltraud-worker
    command: ["jobs", "run"]
    restart: unless-stopped
    env_file: /opt/edeltraud/api.env
    volumes:
      - /opt/edeltraud/data:/data
    networks: [egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g

networks:
  # Docker network of the TLS proxy (Caddy container). Must exist before "up"; update.sh reads
  # PROXY_NETWORK from api.env. Proxy on the host instead: create it once with "docker network create proxy".
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
  # Own bridge network for the browser worker; keep internal services off it.
  egress:
    driver: bridge
