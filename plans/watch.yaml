# Watch: weekly passive run, active modules monthly with valid proof of ownership
# (see src/watch/runner.ts); mail only on new findings (diff by fingerprint).
plan: watch
version: 1
limits: { totalMs: 120000, requests: 400, browser: true }
modules:
  - collect.page
  - collect.bundles: { maxBundles: 80, followLazyChunks: true }
  - collect.sourcemaps: { headOnly: false, maxMaps: 20 }
  - collect.tls
  - collect.render: { waitMs: 4000, maxRequests: 300, audit: true }
  - collect.dns
  - collect.legal
  - collect.wellknown
  - collect.crawl: { maxPages: 5 }
  - collect.errorpages
  - stack.detect
  - secrets.frontend
  - deps.vulnerable
  - build.dev-mode
  - errors.verbose
  - privacy.legal-pages
  - ops.errors-console
  - a11y.basics
  - a11y.statement
  - seo.basics
  - ops.404
  - a11y.axe
  - perf.weight
  - perf.vitals
  - mixed.content
  - sri.missing
  - privacy.third-party
  - privacy.google-fonts
  - privacy.consent-before-tracking
  - deps.server
  - next.data-leak
  - ai.system-prompt-exposed
  - headers.security
  - headers.csp-quality
  - cookies.flags
  - tls.basics
  - dns.mail
  - dns.dangling
  - wellknown.securitytxt
  - wellknown.robots-hints
  - stack.generator
  - endpoints.discovered
  - auth.client-only
  - api.unauth: { maxEndpoints: 20 }
  - cors.policy: { maxEndpoints: 5 }
  - sourcemaps.exposed
  - supabase.config
  - firebase.config
  - supabase.auth-settings
  - supabase.rls-read: { maxTables: 10 }
  - supabase.rpc-exposed
  - supabase.storage-public
  - firebase.rtdb-open
  - firebase.firestore-open: { maxCollections: 10 }
  - firebase.storage-open
  - paths.sensitive
  - ai.client-llm-call
presentation:
  showFindings: all
  fixPrompts: true
