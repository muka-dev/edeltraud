name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Demo runs offline
        run: npm run demo
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -t edeltraud-api .
      - name: Smoke test /health
        run: |
          docker run -d --name api -p 8787:8787 edeltraud-api
          for i in $(seq 1 20); do curl -fsS http://localhost:8787/health && exit 0; sleep 1; done
          docker logs api; exit 1
