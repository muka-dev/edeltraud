name: Bug
description: Something in the scanner, CLI or API does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: Steps, command or API call, actual and expected result. }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version or commit, placeholder: "0.1.0 / abc1234" }
  - type: input
    id: node
    attributes: { label: Node.js version, placeholder: "22.18.0" }
  - type: textarea
    id: logs
    attributes: { label: Output (with --verbose), render: text, description: Remove keys, tokens and private URLs first. }
