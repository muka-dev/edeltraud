# Deep check: report + active probes after proof of ownership. Probes follow in wave 3.
plan: deep
version: 1
limits: { totalMs: 300000, requests: 800, browser: true }
modules:
  - collect.page
  - collect.bundles: { maxBundles: 120, followLazyChunks: true }
  - collect.sourcemaps: { headOnly: true, maxMaps: 40 }
  - collect.tls
  - collect.render: { waitMs: 4000, maxRequests: 300 }
  - collect.dns
  - collect.legal
  - collect.wellknown
  - collect.errorpages
  - stack.detect
  - secrets.frontend
  - deps.vulnerable
  - build.dev-mode
  - errors.verbose
  - privacy.legal-pages
  - ops.errors-console
  - mixed.content
  - sri.missing
  - privacy.third-party
  - privacy.google-fonts
  - privacy.consent-before-tracking
  - deps.server
  - next.data-leak
  - ai.system-prompt-exposed
  - headers.security
  - headers.csp-quality
  - cookies.flags
  - tls.basics
  - dns.mail
  - dns.dangling
  - wellknown.securitytxt
  - wellknown.robots-hints
  - stack.generator
  - endpoints.discovered
  - auth.client-only
  - api.unauth: { maxEndpoints: 20 }
  - cors.policy: { maxEndpoints: 5 }
  - sourcemaps.exposed
  - supabase.config
  - firebase.config
  - supabase.auth-settings
  - supabase.rls-read: { maxTables: 25 }
  - supabase.rpc-exposed
  - supabase.storage-public
  - firebase.rtdb-open
  - firebase.firestore-open: { maxCollections: 10 }
  - firebase.storage-open
  - paths.sensitive
  - ai.client-llm-call
presentation:
  showFindings: all
  fixPrompts: true
